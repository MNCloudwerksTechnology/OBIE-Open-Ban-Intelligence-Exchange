# Fail2Ban configuration file
#
# Publishes every Fail2Ban ban to OBIE as a signed verdict of this node, by
# calling `obiectl report` against the local obied. The matched log lines are
# piped to obiectl, which hands them to obied over the local admin socket;
# obied only publishes their SHA-256 hash and the failure count, never the
# lines themselves.
#
# The action never fails or blocks Fail2Ban: obiectl gives up after
# <obiectl_timeout>, and if obied is down (or refuses the report) the error is
# logged to syslog with the tag obie-fail2ban and the action still succeeds.
#
# Add it to a jail next to the ban action, e.g. in jail.local:
#
#   [sshd]
#   enabled = true
#   action  = %(action_)s
#             obie
#
#   [nginx-http-auth]
#   action  = %(action_)s
#             obie[reason=password_bruteforce, confidence=0.9]
#
# Parameters (all optional, see [Init] below for the defaults):
#   protocol         attacked service, e.g. ssh, http or smtp. Empty: derived
#                    from the jail name (sshd -> ssh, nginx-* -> http,
#                    postfix-* -> smtp, dovecot -> imap, ...).
#   reason           behavior class of the attack, [a-z0-9_]+.
#   confidence       confidence of the verdict in [0, 1]; empty: obiectl's
#                    default (0.8).
#   mitre            comma-separated MITRE ATT&CK technique IDs; T1110 (Brute
#                    Force) fits authentication jails. Set it empty for others.
#   revoke_on_unban  true: revoke the verdict when Fail2Ban unbans the address.
#                    Otherwise unbanning does nothing and the verdict expires
#                    with its TTL, which is the ban time.
#   revoke_reason    reason given for such revocations.
#   obiectl          obiectl binary (name on PATH or absolute path).
#   socket           obied's admin socket (admin.socket in obie.yaml).
#   obiectl_timeout  how long obiectl waits for obied.
#   syslog_priority  syslog priority of failure messages.
#
# Documentation: documentation/guides/fail2ban.md in the OBIE repository.
#
# Note on the syntax: Fail2Ban reads this file with Python's configparser, so
# a literal percent sign is written %% and a semicolon must not follow
# whitespace (" ;" starts a comment).

[Definition]

# A restored ban (after a Fail2Ban restart) was already reported; its verdict
# is still active in obied.
norestored = 1

actionstart =

actionstop =

actioncheck =

# A manual ban (fail2ban-client set <jail> banip) has no failures; it counts
# as one event.
# The ban time becomes the verdict's TTL, in whole seconds (bantime.increment
# yields fractions) and at least obied's minimum of 60s; a permanent ban
# (bantime -1) uses obied's decision.default_ttl. obied caps the TTL at
# decision.max_ttl.
actionban = <_log_fn>
            proto='<protocol>'
            if [ -z "$proto" ]; then
              case '<name>' in
                *ssh*|*dropbear*) proto=ssh;;
                *postfix*|*exim*|*sendmail*|*smtp*) proto=smtp;;
                *dovecot*|*courier*|*imap*) proto=imap;;
                *ftp*) proto=ftp;;
                *nginx*|*apache*|*lighttpd*|*http*) proto=http;;
                *) proto=$(printf '%%s' '<name>' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_-' '_' | cut -c 1-32);;
              esac
            fi
            events="<failures>"
            if ! [ "$events" -ge 1 ] 2>/dev/null; then events=1; fi
            set -- report --ip "<ip>" --protocol "$proto" --reason '<reason>' --events "$events"
            if [ -n '<confidence>' ]; then set -- "$@" --confidence '<confidence>'; fi
            if [ -n '<mitre>' ]; then set -- "$@" --mitre '<mitre>'; fi
            ttl="<bantime>"
            ttl=${ttl%%.*}
            if [ "$ttl" -ge 0 ] 2>/dev/null; then
              if [ "$ttl" -lt 60 ]; then ttl=60; fi
              set -- "$@" --ttl "${ttl}s"
            fi
            matches="<matches>"
            if [ -n "$matches" ]; then
              out=$(printf '%%s\n' "$matches" | <_obiectl> "$@" --evidence-from-stdin 2>&1)
            else
              out=$(<_obiectl> "$@" 2>&1)
            fi
            rc=$?
            if [ "$rc" -ne 0 ]; then
              obie_log "could not report <ip> of jail <name> to OBIE (obiectl exit code $rc): $out"
            fi
            exit 0

actionunban = <_log_fn>
              if [ '<revoke_on_unban>' = true ]; then
                out=$(<_obiectl> revoke --reason '<revoke_reason>' "<ip>" 2>&1)
                rc=$?
                case "$out" in
                  *"no active verdict"*) rc=0;;
                esac
                if [ "$rc" -ne 0 ]; then
                  obie_log "could not revoke the OBIE verdict on <ip> of jail <name> (obiectl exit code $rc): $out"
                fi
              fi
              exit 0

_obiectl = '<obiectl>' --socket '<socket>' --timeout '<obiectl_timeout>'

# Defines obie_log, which logs its argument, flattened to one line, to syslog
# (to stderr if logger is missing).
_log_fn = obie_log() {
            msg=$(printf '%%s' "$1" | tr '\n' ' ')
            logger -t obie-fail2ban -p '<syslog_priority>' -- "$msg" 2>/dev/null || printf 'obie-fail2ban: %%s\n' "$msg" >&2
          }

[Init]

protocol =
reason = bruteforce
confidence =
mitre = T1110
revoke_on_unban = false
revoke_reason = unbanned
obiectl = obiectl
socket = /run/obie/obie.sock
obiectl_timeout = 5s
syslog_priority = daemon.warning
