spring.application.name=obie-website

# Static content is served by StaticSiteConfig (prerendered pages, no index
# fallback); switch off Spring Boot's default mapping so it cannot interfere.
spring.web.resources.add-mappings=false

# Actuator lives under /api; only the health endpoint is exposed over HTTP,
# without details, and there is no endpoint discovery page at /api.
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Deployment settings come from OBIE_* environment variables; website/README.md
# lists them all. Required ones have no default: the application refuses to
# start without them.

# PostgreSQL; the schema is managed by Flyway (src/main/resources/db/migration).
spring.datasource.url=${OBIE_DB_URL:}
spring.datasource.username=${OBIE_DB_USERNAME:}
spring.datasource.password=${OBIE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# SMTP for the inquiry mails.
spring.mail.host=${OBIE_SMTP_HOST:}
spring.mail.port=${OBIE_SMTP_PORT:587}
spring.mail.username=${OBIE_SMTP_USERNAME:}
spring.mail.password=${OBIE_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=${OBIE_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${OBIE_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${OBIE_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# A mail server that is down must not keep the application from starting.
management.health.mail.enabled=false

# Strict JSON: unknown fields and values of the wrong type are errors.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false

obie.web.site-origin=${OBIE_SITE_ORIGIN:}
obie.web.max-request-body=16KB

obie.inquiry.recipient=${OBIE_INQUIRY_RECIPIENT:}
obie.inquiry.mail-from=${OBIE_MAIL_FROM:}
obie.inquiry.secret=${OBIE_INQUIRY_SECRET:}
obie.inquiry.min-fill-time=${OBIE_INQUIRY_MIN_FILL_TIME:PT3S}
obie.inquiry.form-token-max-age=${OBIE_INQUIRY_FORM_TOKEN_MAX_AGE:P1D}
obie.inquiry.rate-limit.capacity=${OBIE_INQUIRY_RATE_LIMIT:5}
obie.inquiry.rate-limit.period=${OBIE_INQUIRY_RATE_LIMIT_PERIOD:PT1H}
obie.inquiry.mail.poll-interval=PT5S
obie.inquiry.mail.max-attempts=${OBIE_MAIL_MAX_ATTEMPTS:10}
obie.inquiry.mail.initial-retry-delay=${OBIE_MAIL_RETRY_INITIAL_DELAY:PT1M}
obie.inquiry.mail.max-retry-delay=${OBIE_MAIL_RETRY_MAX_DELAY:PT6H}
obie.inquiry.retention.max-age=${OBIE_INQUIRY_RETENTION:P12M}
obie.inquiry.retention.cron=0 30 3 * * *
