# Settings for the integration tests (IntegrationTest); the database and the
# SMTP port come from the container and server started there.
spring.datasource.url=${test.postgres.url}
spring.datasource.username=${test.postgres.username}
spring.datasource.password=${test.postgres.password}
spring.mail.port=${test.smtp.port}
obie.web.site-origin=https://obie.example
obie.inquiry.recipient=markus@obie.example
obie.inquiry.mail-from=website@obie.example
obie.inquiry.secret=integration-test-secret-0123456789abcdef
# High enough that no test except the rate-limit test runs into it.
obie.inquiry.rate-limit.capacity=1000
obie.inquiry.mail.poll-interval=PT0.1S
obie.inquiry.mail.initial-retry-delay=PT0.2S
obie.inquiry.mail.max-retry-delay=PT1S
obie.inquiry.mail.max-attempts=5
spring.mail.host=127.0.0.1
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
