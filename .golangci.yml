# golangci-lint v2 configuration. The linter version is pinned in the Makefile
# (GOLANGCI_LINT_VERSION); run it via `make lint`.
version: "2"

run:
  timeout: 5m
  tests: true
  # The soak test (make soak), the resource measurement (make resources),
  # the sandbox walkthrough check (make sandbox-check), the tutorial check
  # (make tutorial-check) and the routing simulation (make sim-routing) are
  # linted like every other test.
  build-tags:
    - soak
    - resources
    - sandbox
    - tutorial
    - sim

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  exclusions:
    paths:
      # A copy of go-libp2p's mocknet for the routing simulation (ADR 0035),
      # kept close to upstream; formatting still applies.
      - test/sim/internal/mocknet
  settings:
    misspell:
      locale: US
      # MITRE (ATT&CK) is a proper noun, not a misspelling of "miter".
      ignore-rules:
        - mitre
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: receiver-naming
        - name: increment-decrement
        - name: unexported-return
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/MNCloudwerksTechnology/obie

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
