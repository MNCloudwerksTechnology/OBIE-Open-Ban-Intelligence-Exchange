# OBIE node configuration — /etc/obie/obie.yaml
#
# Every key is optional: an omitted key takes the default shown here, so this
# file configures exactly the same node as an empty one. Validate changes
# before restarting or reloading the node:
#
#   obied --config /etc/obie/obie.yaml --check-config
#
# SIGHUP makes obied re-read this file: node.mode, trust, decision,
# allowlist (including the allowlist.files) and console take effect at
# once; changes to other keys need a restart and are logged as such. An invalid file is
# rejected and the running configuration kept.
#
# Unknown keys, values of the wrong type and invalid values are errors that
# name the offending key path (e.g. "trust.publishers[1].weight"); obied
# refuses to start until they are fixed.
#
# Durations are written in Go syntax ("10s", "90m", "36h") or as whole days
# ("7d"). Paths must be absolute.

node:
  # Directory for persistent node state (identity key; the event store lives
  # in <state_dir>/db, created with mode 0700).
  state_dir: /var/lib/obie
  # observe: decide, log and show decisions, but never block anything.
  # enforce: additionally push blocks to the enforcement backend.
  # The mode changes only here: edit it and send obied SIGHUP (or restart).
  mode: observe
  # Longest time a graceful shutdown (SIGTERM/SIGINT) may take before obied
  # gives up waiting for its subsystems and exits non-zero (> 0).
  shutdown_timeout: 10s

admin:
  # Unix socket of the local admin API used by obiectl. Its directory must
  # exist and should be accessible only to the obie user and group.
  socket: /run/obie/obie.sock
  # Group that owns the socket; members may run obiectl. Under the shipped
  # systemd unit it must be the unit's Group= (obie): its system call
  # filter does not allow obied to change the socket's group. obied also checks
  # the connecting process (SO_PEERCRED): only root, its own user and members
  # of this group are served.
  socket_group: obie

mesh:
  # libp2p multiaddrs to listen on. They must not contain /p2p/<peer-id>:
  # the node listens under its own identity.
  listen:
    - /ip4/0.0.0.0/tcp/4001
    - /ip4/0.0.0.0/udp/4001/quic-v1
    - /ip6/::/tcp/4001
    - /ip6/::/udp/4001/quic-v1
  # Peers to dial at startup. Each entry is a transport address ending in the
  # peer's ID, so the connection is authenticated. For example:
  #   - /dns4/seed.example.org/tcp/4001/p2p/12D3KooWGzBX6MWMMz3kHmFfyT3vJxFoy4xQF8NbXN7xBAFhGyvd
  bootstrap: []
  # Token buckets that bound the gossiped events the node accepts: on
  # average events_per_second, at most burst at once. Events beyond a limit
  # are dropped and not relayed; the peer that forwarded them is not
  # penalized. An event counts against both limits only if both admit it.
  rate_limit:
    # Events signed by one publisher.
    publisher:
      events_per_second: 10
      burst: 50
    # Events forwarded by one directly connected peer. A peer relays the
    # events of every publisher, each up to the publisher limit, so keep
    # this well above it: a relay that forwards a flooding publisher's
    # admitted events must not use up the room for everyone else's.
    peer:
      events_per_second: 50
      burst: 250

store:
  # Most verdicts the event store holds (>= 1): one per publisher and
  # indicator, so a flood of unique indicators — even from a trusted peer —
  # cannot fill the disk. When the store is full, the verdict that expires
  # first makes room (counted in obie_store_evictions_total); a new verdict
  # that would expire before all stored ones is refused instead. This node's
  # own verdicts are never evicted. About 0.7 KiB of disk and 3 KiB of
  # memory per verdict (measured in documentation/operations/performance.md).
  max_indicators: 1000000

trust:
  # Publishers whose verdicts count towards a decision, each with a weight
  # between 0 (ignored) and 1 (fully trusted). Peer IDs must be unique.
  # For example:
  #   - peer_id: 12D3KooWGzBX6MWMMz3kHmFfyT3vJxFoy4xQF8NbXN7xBAFhGyvd
  #     name: seed.example.org
  #     weight: 0.8
  publishers: []
  # Weight of publishers not listed above (0..1). 0 ignores unknown peers.
  default_weight: 0
  # Weight of this node's own observations (0..1).
  local_weight: 1.0

decision:
  # An address is blocked when its score — the sum of weight x confidence
  # over the distinct publishers' latest active "ban" verdicts — reaches
  # threshold (> 0) AND at least quorum (>= 1) distinct publishers with a
  # weight above 0 reported it. "watch" verdicts are shown by
  # `obiectl explain` but never count. The allowlist always wins.
  threshold: 1.8
  quorum: 2
  # true: this node's own ban verdicts block on their own, without threshold
  # and quorum, so local detections protect this host immediately (only
  # while trust.local_weight > 0).
  local_autoblock: true
  # Longest time a block may last from the moment it is decided, whatever
  # the verdicts request; also caps the TTL of verdicts reported with
  # `obiectl report`.
  max_ttl: 30d
  # Block duration when a verdict requests none, and the TTL of verdicts
  # reported with `obiectl report` without --ttl; must not exceed max_ttl.
  default_ttl: 7d

allowlist:
  # Addresses that are never blocked, whatever the mesh reports. Built in,
  # always: loopback, private (RFC 1918), CGNAT (100.64.0.0/10), link-local,
  # ULA (fc00::/7), multicast, unspecified and the documentation ranges;
  # also this node's own listen/interface addresses and the IPs of the
  # mesh.bootstrap peers. An indicator overlapping an allow-listed range is
  # "allowed" regardless of its score. An operator force-block override
  # (`obiectl block`) beats the entries below, but never the built-in,
  # own or bootstrap addresses. `obiectl allow` beats everything. `obiectl
  # report` refuses to publish verdicts on allow-listed indicators.
  #
  # Networks in CIDR notation without host bits, e.g. [192.0.2.0/24,
  # 2001:db8::/32]. Add your own management networks, and this node's
  # public address if it is not on an interface (e.g. behind NAT).
  cidrs: []
  # Absolute paths of files with one IP address or CIDR range per line
  # (blank lines and # comments allowed), e.g. [/etc/obie/allowlist.txt].
  # They are re-read on SIGHUP; a missing file or an invalid line keeps
  # obied from starting, and a reload with one is rejected.
  files: []

enforce:
  # Only used in node.mode enforce. dryrun: keep the blocks in memory and
  # log every add/remove as JSON, blocking nothing. nftables: drop blocked
  # sources through the sets of the table `inet obie` (Linux, needs
  # CAP_NET_ADMIN); no other table is ever touched.
  backend: dryrun
  # Upper bound on simultaneously blocked addresses/ranges (>= 1). Beyond
  # it the lowest-score blocks are skipped, logged and counted.
  max_entries: 100000
  # How often the backend is reconciled with the decided state (> 0), in
  # addition to right after every decision change; also the longest retry
  # delay after a failed apply.
  reconcile_interval: 10s
  nftables:
    # Also drop blocked sources in a `forward` chain (routers, container
    # hosts), not only in the `input` chain.
    forward: false
    # Remove the table inet obie when the systemd unit stops (its
    # ExecStopPost runs `obied teardown-firewall --on-stop`). false keeps
    # the blocks across restarts until their timeout.
    teardown_on_stop: false

metrics:
  # ip:port of the Prometheus metrics (/metrics, namespace obie_) and health
  # endpoints (/healthz, /readyz). Use an IP address, not a hostname;
  # ":9464" listens on all interfaces.
  listen: 127.0.0.1:9464

console:
  # Local web console that shows what the node is doing. Off unless you
  # switch it on; a reload (SIGHUP) starts, stops or moves it without
  # touching anything else. Sign in with the token that `obiectl console`
  # shows.
  enabled: false
  # Loopback ip:port it listens on: 127.0.0.1 or ::1 only, so that it is
  # reachable from this host alone. Any other address is refused. From
  # another machine, forward the port over SSH:
  #   ssh -L 9465:127.0.0.1:9465 <this host>
  listen: 127.0.0.1:9465
  # Let the console allow, block, remove overrides, report and revoke,
  # each after a confirmation, like obiectl and recorded in the audit log.
  # false keeps the console strictly read-only.
  actions: true

audit:
  # JSON-lines audit log of every decision change, peer connection, reload
  # and mode change, with ECS field names (see
  # documentation/operations/monitoring.md); the web console's activity
  # timeline reads it back. Empty disables it; otherwise an absolute file
  # path in an existing directory, e.g. /var/log/obie/audit.jsonl. SIGHUP
  # reopens it (logrotate).
  path: ""

log:
  # Minimum level of the JSON logs written to stderr: debug, info, warn or error.
  level: info
